<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNESCO World Heritage Sites</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  :root {
    --gold: #C9A84C;
    --bg: #0D0F14;
    --bg2: #13161E;
    --bg3: #1A1E28;
    --panel: #161A24;
    --border: rgba(201,168,76,0.18);
    --text: #F0EBE0;
    --text-muted: #8A8478;
    --cultural: #C9A84C;
    --natural: #4CAF7A;
    --mixed: #7B6FE8;
    --danger: #E8604C;
    --header-h: 54px;
    --sidebar-w: 300px;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text); }

  /* ── DESKTOP LAYOUT ── */
  #app { display:flex; flex-direction:column; height:100vh; height:100dvh; }
  #header { flex-shrink:0; height:var(--header-h); padding:0 20px; background:var(--bg2); border-bottom:1px solid var(--border); display:flex; align-items:center; gap:16px; z-index:1000; position:relative; }
  #main { display:flex; flex:1; overflow:hidden; }
  #sidebar { width:var(--sidebar-w); flex-shrink:0; background:var(--panel); border-right:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; z-index:500; transition:transform 0.3s cubic-bezier(.4,0,.2,1); }
  #map-wrap { flex:1; position:relative; overflow:hidden; }
  #map { width:100%; height:100%; }

  /* ── HEADER ── */
  .logo { display:flex; align-items:center; gap:10px; flex-shrink:0; }
  .logo-icon { width:30px; height:30px; background:var(--gold); border-radius:5px; display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0; }
  .logo-text h1 { font-family:'Playfair Display',serif; font-size:16px; font-weight:700; color:var(--gold); line-height:1.1; }
  .logo-text p { font-size:10px; color:var(--text-muted); letter-spacing:0.07em; text-transform:uppercase; }
  .header-stats { display:flex; gap:20px; margin-left:auto; }
  .hstat { text-align:center; }
  .hstat-num { font-family:'Playfair Display',serif; font-size:18px; font-weight:700; color:var(--gold); }
  .hstat-label { font-size:9px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.06em; }
  .search-wrap { position:relative; }
  .search-wrap input { background:var(--bg3); border:1px solid var(--border); color:var(--text); padding:7px 12px 7px 32px; border-radius:6px; font-family:'DM Sans',sans-serif; font-size:12px; width:190px; outline:none; transition:border 0.2s; }
  .search-wrap input:focus { border-color:var(--gold); }
  .search-wrap input::placeholder { color:var(--text-muted); }
  .search-icon { position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--text-muted); font-size:12px; pointer-events:none; }
  /* hamburger — hidden on desktop */
  #menu-toggle { display:none; background:none; border:none; color:var(--text); cursor:pointer; padding:6px; border-radius:5px; flex-shrink:0; }
  #menu-toggle svg { display:block; }

  /* ── SIDEBAR INNER ── */
  #sidebar-header { padding:14px 14px 10px; border-bottom:1px solid var(--border); flex-shrink:0; }
  #sidebar-header h2 { font-family:'Playfair Display',serif; font-size:13px; color:var(--gold); margin-bottom:10px; }
  .filter-section { margin-bottom:10px; }
  .filter-label { font-size:9px; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-muted); margin-bottom:5px; }
  .filter-row { display:flex; gap:5px; flex-wrap:wrap; }
  .filter-btn { padding:4px 9px; border-radius:4px; border:1px solid var(--border); background:transparent; color:var(--text-muted); font-size:11px; cursor:pointer; transition:all 0.15s; font-family:'DM Sans',sans-serif; touch-action:manipulation; }
  .filter-btn:hover { border-color:var(--gold); color:var(--text); }
  .filter-btn.active { background:var(--gold); border-color:var(--gold); color:#000; font-weight:500; }
  .filter-btn.cultural.active { background:var(--cultural); border-color:var(--cultural); }
  .filter-btn.natural.active { background:var(--natural); border-color:var(--natural); color:#000; }
  .filter-btn.mixed.active { background:var(--mixed); border-color:var(--mixed); }
  select { background:var(--bg3); border:1px solid var(--border); color:var(--text); padding:6px 10px; border-radius:4px; font-family:'DM Sans',sans-serif; font-size:12px; width:100%; outline:none; cursor:pointer; }
  select:focus { border-color:var(--gold); }
  select option { background:var(--bg3); }

  /* ── DASHBOARD ── */
  #dashboard { padding:12px 14px; border-bottom:1px solid var(--border); flex-shrink:0; }
  #dashboard h2 { font-family:'Playfair Display',serif; font-size:11px; color:var(--gold); margin-bottom:8px; text-transform:uppercase; letter-spacing:0.06em; }
  .dash-grid { display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-bottom:9px; }
  .dash-card { background:var(--bg3); border:1px solid var(--border); border-radius:5px; padding:8px; text-align:center; }
  .dash-card-num { font-family:'Playfair Display',serif; font-size:20px; font-weight:700; color:var(--gold); }
  .dash-card-label { font-size:9px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.06em; margin-top:1px; }
  .type-bars { display:flex; flex-direction:column; gap:5px; }
  .type-bar-row { display:flex; align-items:center; gap:7px; }
  .type-bar-label { font-size:10px; color:var(--text-muted); width:54px; flex-shrink:0; }
  .type-bar-track { flex:1; height:5px; background:var(--bg3); border-radius:3px; overflow:hidden; }
  .type-bar-fill { height:100%; border-radius:3px; transition:width 0.5s ease; }
  .type-bar-count { font-size:10px; color:var(--text); width:26px; text-align:right; flex-shrink:0; }

  /* ── SITE LIST ── */
  #site-list-wrap { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  #site-list-wrap::-webkit-scrollbar { width:3px; }
  #site-list-wrap::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
  .list-count { padding:8px 14px 5px; font-size:10px; color:var(--text-muted); border-bottom:1px solid var(--border); }
  .site-item { padding:9px 14px; border-bottom:1px solid rgba(255,255,255,0.04); cursor:pointer; transition:background 0.12s; display:flex; align-items:flex-start; gap:9px; touch-action:manipulation; }
  .site-item:hover, .site-item:active { background:var(--bg3); }
  .site-item.active { background:rgba(201,168,76,0.07); border-left:2px solid var(--gold); }
  .site-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; margin-top:4px; }
  .site-info h4 { font-size:12px; font-weight:500; color:var(--text); line-height:1.3; }
  .site-meta { display:flex; gap:5px; margin-top:2px; align-items:center; flex-wrap:wrap; }
  .site-country, .site-year { font-size:10px; color:var(--text-muted); }
  .danger-tag { color:var(--danger); font-size:9px; }

  /* ── MAP OVERLAYS ── */
  .leaflet-popup-content-wrapper { background:var(--bg2)!important; border:1px solid var(--border)!important; border-radius:8px!important; box-shadow:0 8px 32px rgba(0,0,0,0.6)!important; color:var(--text)!important; }
  .leaflet-popup-tip { background:var(--bg2)!important; }
  .leaflet-popup-content { margin:0!important; }
  .popup-inner { padding:0; min-width:230px; max-width:280px; }
  .popup-type-badge { display:inline-block; font-size:9px; padding:2px 7px; border-radius:3px; font-weight:600; margin-bottom:6px; letter-spacing:0.04em; }
  .popup-inner h3 { font-family:'Playfair Display',serif; font-size:14px; font-weight:700; margin-bottom:3px; color:var(--text); line-height:1.3; }
  .popup-inner .country { font-size:10px; color:var(--text-muted); margin-bottom:0; }
  .popup-inner .desc { font-size:11px; color:rgba(240,235,224,0.72); line-height:1.5; }
  .popup-stats { display:flex; gap:0; border-top:1px solid var(--border); }
  .popup-stat { flex:1; text-align:center; padding:7px 0; border-right:1px solid var(--border); }
  .popup-stat:last-child { border-right:none; }
  .popup-stat-val { font-family:'Playfair Display',serif; font-size:13px; font-weight:700; color:var(--gold); }
  .popup-stat-lab { font-size:8px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.04em; }
  .leaflet-popup-close-button { color:var(--text-muted)!important; top:8px!important; right:8px!important; font-size:18px!important; width:20px!important; height:20px!important; line-height:20px!important; }
  .popup-body { padding:10px 12px 0; }
  .popup-divider { height:1px; background:var(--border); margin:8px 0; }
  .popup-extra { display:flex; flex-direction:column; gap:3px; margin-bottom:8px; }
  .popup-extra-row { display:flex; gap:6px; font-size:10px; }
  .popup-extra-row .lbl { color:var(--text-muted); width:58px; flex-shrink:0; }
  .popup-extra-row .val { color:var(--text); }

  #map-legend { position:absolute; bottom:20px; left:16px; z-index:400; background:rgba(13,15,20,0.88); backdrop-filter:blur(8px); border:1px solid var(--border); border-radius:7px; padding:10px 13px; }
  #map-legend h4 { font-size:9px; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-muted); margin-bottom:7px; }
  .legend-item { display:flex; align-items:center; gap:7px; margin-bottom:4px; font-size:11px; color:var(--text-muted); }
  .legend-marker { width:12px; height:12px; flex-shrink:0; }

  #map-counter { position:absolute; top:14px; right:14px; z-index:400; background:rgba(13,15,20,0.88); backdrop-filter:blur(8px); border:1px solid var(--border); border-radius:6px; padding:6px 12px; font-size:11px; color:var(--text-muted); }
  #map-counter span { color:var(--gold); font-family:'Playfair Display',serif; font-size:15px; font-weight:700; }

  #basemap-switcher { position:absolute; top:14px; left:50%; transform:translateX(-50%); z-index:400; display:flex; gap:3px; background:rgba(13,15,20,0.9); backdrop-filter:blur(8px); border:1px solid var(--border); border-radius:7px; padding:4px; }
  .bm-btn { padding:4px 11px; border-radius:4px; border:none; background:transparent; color:var(--text-muted); font-size:10px; cursor:pointer; font-family:'DM Sans',sans-serif; transition:all 0.15s; white-space:nowrap; touch-action:manipulation; }
  .bm-btn:hover { color:var(--text); background:rgba(255,255,255,0.06); }
  .bm-btn.active { background:var(--gold); color:#000; font-weight:500; }

  /* ── PROFESSIONAL MARKER ── */
  .mkr { display:block; position:relative; cursor:pointer; }
  .mkr-pin { position:relative; display:flex; align-items:center; justify-content:center; }
  @keyframes danger-pulse { 0%,100%{transform:scale(1);opacity:.8} 50%{transform:scale(1.5);opacity:0} }
  .mkr-pulse { position:absolute; border-radius:50%; animation:danger-pulse 1.6s ease-out infinite; pointer-events:none; }

  /* ── ANIMATIONS ── */
  @keyframes fadeIn { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:none} }
  .site-item { animation:fadeIn 0.18s ease both; }

  /* ── MOBILE FAB ── */
  #mobile-fab { display:none; }
  @media (max-width:680px) {
    #mobile-fab {
      display:flex; align-items:center; gap:8px;
      position:absolute;
      bottom:76px;
      left:50%; transform:translateX(-50%);
      z-index:500;
      background:var(--gold); color:#000;
      border:none; border-radius:24px;
      padding:10px 20px;
      font-family:'DM Sans',sans-serif; font-size:13px; font-weight:600;
      box-shadow:0 4px 16px rgba(0,0,0,0.5);
      cursor:pointer; white-space:nowrap;
      touch-action:manipulation;
    }
    #mobile-fab.sheet-open { display:none; }
  }


  #sheet-topbar { display:none; }
  #search-input-mobile { display:none; }

  /* ── MOBILE ── */
  @media (max-width: 680px) {
    :root { --header-h: 52px; }

    #header { padding:0 14px; gap:8px; }
    .logo-text p { display:none; }
    .logo-text h1 { font-size:15px; }
    .search-wrap { display:none; }
    .header-stats { gap:14px; margin-left:auto; }
    .hstat-num { font-size:16px; }
    .hstat-label { font-size:8px; }
    #menu-toggle { display:flex; align-items:center; justify-content:center; }

    /* map fills full area */
    #main { position:relative; flex:1; overflow:hidden; }
    #map-wrap { position:absolute; inset:0; }
    #map { width:100%; height:100%; }

    /* ── BOTTOM SHEET ── */
    #sidebar {
      position:absolute;
      bottom:0; left:0; right:0;
      width:100%;
      height:82dvh;
      border-right:none;
      border-top:1px solid var(--border);
      border-radius:18px 18px 0 0;
      transform:translateY(100%);
      transition:transform 0.3s cubic-bezier(.4,0,.2,1);
      z-index:900;
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }
    #sidebar.open { transform:translateY(0); }

    /* drag handle */
    #sheet-handle {
      display:block;
      width:40px; height:4px;
      background:rgba(201,168,76,0.3);
      border-radius:2px;
      margin:10px auto 0;
      flex-shrink:0;
    }

    /* ── SHEET TOPBAR: search + filter toggle ── */
    #sheet-topbar {
      display:flex;
      align-items:center;
      gap:8px;
      padding:10px 14px 8px;
      flex-shrink:0;
      border-bottom:1px solid var(--border);
    }
    .sheet-search-wrap {
      flex:1; position:relative;
    }
    .sheet-search-wrap input {
      display:block;
      width:100%;
      background:var(--bg3);
      border:1px solid var(--border);
      color:var(--text);
      padding:8px 12px 8px 30px;
      border-radius:6px;
      font-family:'DM Sans',sans-serif;
      font-size:13px;
      outline:none;
    }
    .sheet-search-wrap input:focus { border-color:var(--gold); }
    .sheet-search-wrap .search-icon {
      position:absolute; left:9px; top:50%; transform:translateY(-50%);
      font-size:12px; color:var(--text-muted); pointer-events:none;
    }
    #filter-toggle-btn {
      display:flex; align-items:center; gap:5px;
      background:var(--bg3); border:1px solid var(--border);
      color:var(--text-muted); border-radius:6px;
      padding:8px 12px; font-size:12px;
      font-family:'DM Sans',sans-serif; cursor:pointer;
      white-space:nowrap; flex-shrink:0;
      touch-action:manipulation;
    }
    #filter-toggle-btn.active { border-color:var(--gold); color:var(--gold); }

    /* ── COLLAPSIBLE FILTERS ── */
    #sidebar-header {
      flex-shrink:0;
      overflow:hidden;
      max-height:0;
      transition:max-height 0.3s ease, padding 0.3s ease;
      padding:0 14px;
      border-bottom:none;
    }
    #sidebar-header.filters-open {
      max-height:260px;
      overflow-y:auto;
      padding:10px 14px;
      border-bottom:1px solid var(--border);
    }
    /* remove the "Filters" h2 heading on mobile — topbar replaces it */
    #sidebar-header h2 { display:none; }

    /* ── DASHBOARD: hide on mobile to save space ── */
    #dashboard { display:none; }

    /* ── SITE LIST: takes ALL remaining space ── */
    #site-list-wrap {
      flex:1;
      overflow-y:auto;
      -webkit-overflow-scrolling:touch;
      min-height:0;
    }

    /* ── OVERLAY ── */
    #sheet-overlay { display:block; }

    /* ── MAP OVERLAYS ── */
    #basemap-switcher { top:auto; bottom:16px; left:50%; transform:translateX(-50%); }
    #map-counter { top:12px; right:12px; }
    #map-legend { bottom:auto; top:90px; left:12px; } /* below zoom controls (~80px tall) */

    /* ── POPUP ── */
    .leaflet-popup-content-wrapper { max-width:88vw!important; }
    .popup-inner { min-width:0; }

    /* ── TOUCH TARGETS ── */
    .filter-btn { padding:8px 12px; font-size:12px; }
    select { padding:10px; font-size:13px; }
    .site-item { padding:13px 16px; }
    .site-info h4 { font-size:13px; }
    .bm-btn { padding:7px 14px; font-size:11px; }
  }

  /* Sheet overlay — hidden on desktop */
  #sheet-overlay { display:none; position:absolute; inset:0; background:rgba(0,0,0,0.5); z-index:800; }
  #sheet-handle { display:none; }
</style>
</head>
<body>
<div id="app">
  <!-- HEADER -->
  <div id="header">
    <div class="logo">
      <div class="logo-icon">🏛️</div>
      <div class="logo-text">
        <h1>UNESCO Heritage</h1>
        <p>World Heritage Sites Explorer</p>
      </div>
    </div>
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="search-input" placeholder="Search sites, countries…">
    </div>
    <div class="header-stats">
      <div class="hstat"><div class="hstat-num" id="hs-total">—</div><div class="hstat-label">Total</div></div>
      <div class="hstat"><div class="hstat-num" id="hs-countries">—</div><div class="hstat-label">Countries</div></div>
      <div class="hstat"><div class="hstat-num" id="hs-danger">—</div><div class="hstat-label">Danger</div></div>
    </div>
    <button id="menu-toggle" onclick="toggleSheet()" aria-label="Toggle filters">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <line x1="3" y1="5" x2="17" y2="5"/><line x1="3" y1="10" x2="17" y2="10"/><line x1="3" y1="15" x2="17" y2="15"/>
      </svg>
    </button>
  </div>

  <div id="main">
    <!-- SHEET OVERLAY (mobile) -->
    <div id="sheet-overlay" onclick="toggleSheet()"></div>
    <!-- SIDEBAR -->
    <div id="sidebar">
      <div id="sheet-handle"></div>

      <!-- MOBILE: compact top bar with search + filter toggle -->
      <div id="sheet-topbar">
        <div class="sheet-search-wrap">
          <span class="search-icon">🔍</span>
          <input type="text" id="search-input-mobile" placeholder="Search sites…" oninput="document.getElementById('search-input').value=this.value; applyFilters()">
        </div>
        <button id="filter-toggle-btn" onclick="toggleFiltersPanel()" aria-label="Toggle filters">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="1" y1="4" x2="15" y2="4"/><line x1="3" y1="8" x2="13" y2="8"/><line x1="5" y1="12" x2="11" y2="12"/></svg>
          Filters
        </button>
      </div>

      <!-- COLLAPSIBLE FILTERS (hidden by default on mobile) -->
      <div id="sidebar-header" class="filters-collapsed">
        <div class="filter-section">
          <div class="filter-label">Type</div>
          <div class="filter-row">
            <button class="filter-btn cultural active" data-type="Cultural" onclick="toggleType(this)">Cultural</button>
            <button class="filter-btn natural active" data-type="Natural" onclick="toggleType(this)">Natural</button>
            <button class="filter-btn mixed active" data-type="Mixed" onclick="toggleType(this)">Mixed</button>
          </div>
        </div>
        <div class="filter-section">
          <div class="filter-label">Continent</div>
          <select id="continent-filter" onchange="applyFilters()">
            <option value="">All Continents</option>
            <option>Africa</option>
            <option>Asia & Pacific</option>
            <option>Europe & North America</option>
            <option>Latin America & Caribbean</option>
            <option>Middle East & Arab States</option>
          </select>
        </div>
        <div class="filter-section">
          <div class="filter-label">Country</div>
          <select id="country-filter" onchange="applyFilters()">
            <option value="">All Countries</option>
          </select>
        </div>
        <div class="filter-section">
          <div class="filter-label">Inscribed Year</div>
          <select id="year-filter" onchange="applyFilters()">
            <option value="">All Years</option>
            <option value="1972-1989">1972 – 1989</option>
            <option value="1990-1999">1990 – 1999</option>
            <option value="2000-2009">2000 – 2009</option>
            <option value="2010-2024">2010 – 2024</option>
          </select>
        </div>
        <div class="filter-section">
          <div class="filter-row">
            <button class="filter-btn" id="danger-btn" onclick="toggleDanger(this)">⚠️ In Danger Only</button>
          </div>
        </div>
      </div>

      <!-- DASHBOARD -->
      <div id="dashboard">
        <h2>Dashboard</h2>
        <div class="dash-grid">
          <div class="dash-card"><div class="dash-card-num" id="d-shown">—</div><div class="dash-card-label">Shown</div></div>
          <div class="dash-card"><div class="dash-card-num" id="d-countries">—</div><div class="dash-card-label">Countries</div></div>
        </div>
        <div class="type-bars">
          <div class="type-bar-row">
            <div class="type-bar-label">Cultural</div>
            <div class="type-bar-track"><div class="type-bar-fill" id="bar-cultural" style="background:var(--cultural);width:0%"></div></div>
            <div class="type-bar-count" id="cnt-cultural">0</div>
          </div>
          <div class="type-bar-row">
            <div class="type-bar-label">Natural</div>
            <div class="type-bar-track"><div class="type-bar-fill" id="bar-natural" style="background:var(--natural);width:0%"></div></div>
            <div class="type-bar-count" id="cnt-natural">0</div>
          </div>
          <div class="type-bar-row">
            <div class="type-bar-label">Mixed</div>
            <div class="type-bar-track"><div class="type-bar-fill" id="bar-mixed" style="background:var(--mixed);width:0%"></div></div>
            <div class="type-bar-count" id="cnt-mixed">0</div>
          </div>
        </div>
      </div>

      <!-- SITE LIST -->
      <div id="site-list-wrap">

// COLOR MAP
const TYPE_COLOR = { Cultural:'#C9A84C', Natural:'#4CAF7A', Mixed:'#7B6FE8' };

document.addEventListener('DOMContentLoaded', function() {

let activeTypes = new Set(['Cultural','Natural','Mixed']);
let dangerOnly = false;
let activeItemId = null;
let markers = {};
let markerLayer;

// MAP
const map = L.map('map', { center:[20,10], zoom:2, zoomControl:true, attributionControl:false });

// BASEMAPS
const BASEMAPS = {
  dark:      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{maxZoom:19}),
  satellite: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19}),
  terrain:   L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{maxZoom:17})
};
let currentBasemap = 'dark';
BASEMAPS.dark.addTo(map);

window.switchBasemap = function(name) {
  if (name === currentBasemap) return;
  map.removeLayer(BASEMAPS[currentBasemap]);
  BASEMAPS[name].addTo(map);
  BASEMAPS[name].bringToBack();
  currentBasemap = name;
  document.querySelectorAll('.bm-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('bm-'+name).classList.add('active');
};

// CIRCLE MARKER STYLES per type — canvas-rendered, zero DOM overhead
const MARKER_STYLE = {
  Cultural: { color:'#8A6B2A', fillColor:'#C9A84C', fillOpacity:0.92, radius:7,  weight:1.5 },
  Natural:  { color:'#2A6B45', fillColor:'#4CAF7A', fillOpacity:0.92, radius:8,  weight:1.5 },
  Mixed:    { color:'#4A3FA8', fillColor:'#7B6FE8', fillOpacity:0.92, radius:7,  weight:1.5 },
};
const DANGER_STYLE  = { color:'#fff', fillColor:'#E8604C', fillOpacity:1, radius:7, weight:2 };

function makeMarker(s) {
  const style = s.danger ? DANGER_STYLE : (MARKER_STYLE[s.type] || MARKER_STYLE.Cultural);
  return L.circleMarker([s.lat, s.lng], style);
}

function getFiltered() {
  const search = document.getElementById('search-input').value.toLowerCase().trim();
  const continent = document.getElementById('continent-filter').value;
  const country = document.getElementById('country-filter').value;
  const yearRange = document.getElementById('year-filter').value;
  return SITES.filter(s => {
    if (!activeTypes.has(s.type)) return false;
    if (dangerOnly && !s.danger) return false;
    if (continent && s.continent !== continent) return false;
    if (country && s.country !== country) return false;
    if (yearRange) {
      const [a,b] = yearRange.split('-').map(Number);
      if (s.year < a || s.year > b) return false;
    }
    if (search && !s.name.toLowerCase().includes(search) && !s.country.toLowerCase().includes(search)) return false;
    return true;
  });
}

function renderMarkers(sites) {
  if (markerLayer) { map.removeLayer(markerLayer); }
  markerLayer = L.layerGroup();
  markers = {};
  sites.forEach(s => {
    const col = TYPE_COLOR[s.type];
    const m = makeMarker(s);
    m.bindPopup(`<div class="popup-inner"><div class="popup-body">
      <div class="popup-type-badge" style="background:${s.danger?'#E8604C':col};color:${s.type==='Cultural'?'#000':'#fff'}">${s.danger?'⚠ In Danger':'✦ '+s.type}</div>
      <h3>${s.name}</h3>
      <div class="country">📍 ${s.country}</div>
      <div class="popup-divider"></div>
      <div class="desc">${s.desc}</div>
      <div class="popup-divider"></div>
      <div class="popup-extra">
        <div class="popup-extra-row"><span class="lbl">Region</span><span class="val">${s.continent}</span></div>
        <div class="popup-extra-row"><span class="lbl">Inscribed</span><span class="val">${s.year}</span></div>
        <div class="popup-extra-row"><span class="lbl">Status</span><span class="val" style="color:${s.danger?'#E8604C':'#4CAF7A'}">${s.danger?'⚠ Endangered':'✓ Active'}</span></div>
      </div>
    </div></div>`, { maxWidth:260 });
    m.on('click', () => highlightItem(s.id));
    markerLayer.addLayer(m);
    markers[s.id] = m;
  });
  markerLayer.addTo(map);
  document.getElementById('map-count').textContent = sites.length;
}

function renderList(sites) {
  document.getElementById('list-count').textContent = `${sites.length} site${sites.length!==1?'s':''} found`;
  const el = document.getElementById('site-list');
  el.innerHTML = sites.map((s,i) => {
    const col = s.danger ? '#E8604C' : TYPE_COLOR[s.type];
    return `<div class="site-item${s.id===activeItemId?' active':''}" id="li-${s.id}" onclick="selectSite(${s.id})" style="animation-delay:${Math.min(i*0.015,0.25)}s">
      <div class="site-dot" style="background:${col}"></div>
      <div class="site-info">
        <h4>${s.name}</h4>
        <div class="site-meta">
          <span class="site-country">${s.country}</span>
          <span style="color:var(--border)">·</span>
          <span class="site-year">${s.year}</span>
          ${s.danger?'<span class="danger-tag">⚠</span>':''}
        </div>
      </div>
    </div>`;
  }).join('');
}

function updateDashboard(sites) {
  const countries = new Set(sites.map(s=>s.country)).size;
  const cCnt = sites.filter(s=>s.type==='Cultural').length;
  const nCnt = sites.filter(s=>s.type==='Natural').length;
  const mCnt = sites.filter(s=>s.type==='Mixed').length;
  const total = sites.length;
  document.getElementById('d-shown').textContent = total;
  document.getElementById('d-countries').textContent = countries;
  document.getElementById('cnt-cultural').textContent = cCnt;
  document.getElementById('cnt-natural').textContent = nCnt;
  document.getElementById('cnt-mixed').textContent = mCnt;
  document.getElementById('bar-cultural').style.width = total ? (cCnt/total*100)+'%' : '0%';
  document.getElementById('bar-natural').style.width  = total ? (nCnt/total*100)+'%' : '0%';
  document.getElementById('bar-mixed').style.width    = total ? (mCnt/total*100)+'%' : '0%';
}

function applyFilters() {
  const filtered = getFiltered();
  renderMarkers(filtered);
  renderList(filtered);
  updateDashboard(filtered);
}

function selectSite(id) {
  activeItemId = id;
  const s = SITES.find(x=>x.id===id);
  if (!s) return;
  map.setView([s.lat, s.lng], 6, {animate:true, duration:0.8});
  if (markers[id]) markers[id].openPopup();
  document.querySelectorAll('.site-item').forEach(el=>el.classList.remove('active'));
  const li = document.getElementById('li-'+id);
  if (li) { li.classList.add('active'); li.scrollIntoView({block:'nearest',behavior:'smooth'}); }
  if (window.innerWidth <= 680) {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sheet-overlay').style.display = 'none';
    const fab = document.getElementById('mobile-fab');
    if (fab) fab.classList.remove('sheet-open');
  }
}

function highlightItem(id) {
  activeItemId = id;
  document.querySelectorAll('.site-item').forEach(el=>el.classList.remove('active'));
  const li = document.getElementById('li-'+id);
  if (li) { li.classList.add('active'); li.scrollIntoView({block:'nearest',behavior:'smooth'}); }
}

function toggleType(btn) {
  const t = btn.dataset.type;
  if (activeTypes.has(t) && activeTypes.size > 1) { activeTypes.delete(t); btn.classList.remove('active'); }
  else if (!activeTypes.has(t)) { activeTypes.add(t); btn.classList.add('active'); }
  applyFilters();
}

function toggleDanger(btn) {
  dangerOnly = !dangerOnly;
  btn.classList.toggle('active', dangerOnly);
  applyFilters();
}

function populateCountries() {
  const countries = [...new Set(SITES.map(s=>s.country))].sort();
  const sel = document.getElementById('country-filter');
  countries.forEach(c => { const o = document.createElement('option'); o.value=c; o.textContent=c; sel.appendChild(o); });
}

function setHeaderStats() {
  document.getElementById('hs-total').textContent    = SITES.length;
  document.getElementById('hs-countries').textContent = new Set(SITES.map(s=>s.country)).size;
  document.getElementById('hs-danger').textContent   = SITES.filter(s=>s.danger).length;
}

document.getElementById('search-input').addEventListener('input', applyFilters);

window.toggleType   = toggleType;
window.toggleDanger = toggleDanger;
window.selectSite   = selectSite;
window.applyFilters = applyFilters;
window.toggleFiltersPanel = function() {
  const panel = document.getElementById('sidebar-header');
  const btn   = document.getElementById('filter-toggle-btn');
  const open  = panel.classList.toggle('filters-open');
  btn.classList.toggle('active', open);
};

window.toggleSheet  = function() {
  const sb = document.getElementById('sidebar');
  const ov = document.getElementById('sheet-overlay');
  const fab = document.getElementById('mobile-fab');
  const open = sb.classList.toggle('open');
  ov.style.display = open ? 'block' : 'none';
  if (fab) fab.classList.toggle('sheet-open', open);
};

populateCountries();
setHeaderStats();
applyFilters();

}); // end DOMContentLoaded
</script>
</body>
</html>
